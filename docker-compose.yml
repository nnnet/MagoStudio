version: "3.8"

services:
  magostudio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: magostudio
    ports:
      - "7008:8080"
    volumes:
      - ./work:/app/work
      - ./video-output:/app/video-output
      - ./source:/app/source
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - raider-net
    restart: unless-stopped

  comfiui:
    build:
      context: ./comfyui-portable
      dockerfile: Dockerfile
    container_name: comfiui-portable
    ports:
      - "8188:8188"
    volumes:
      - ./work:/comfyui/work
      - ./video-output:/comfyui/video-output
      - ./comfyui-output:/comfyui/output
      - ./comfyui-models:/comfyui/models
      - ./source:/comfyui/source
    environment:
      - COMFYUI_PORT=8188
    networks:
      - raider-net
    restart: unless-stopped

networks:
  raider-net:
    driver: bridge
