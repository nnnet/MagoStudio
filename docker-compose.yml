version: "3.8"

services:
  magostudio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: magostudio-app
    ports:
      - "7008:3000"
    volumes:
      - ./work:/app/work
      - ./video-output:/app/video-output
      - ./source:/app/source
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - MAGO_BACKEND_URL=http://mock-auth:9999
    networks:
      - raider-net
    restart: unless-stopped

  comfiui:
    build:
      context: ./comfyui-portable
      dockerfile: Dockerfile
    container_name: magostudio-comfiui
    ports:
      - "8188:8188"
    volumes:
      - ./work:/comfyui/work
      - ./video-output:/comfyui/video-output
      - ./comfyui-output:/comfyui/output
      - ./comfyui-models:/comfyui/models
      - ./source:/comfyui/source
    environment:
      - COMFYUI_PORT=8188
    networks:
      - raider-net
    restart: unless-stopped

  mock-auth:
    image: python:3.11-slim
    command:
      - python3
      - -c
      - >
        from http.server import HTTPServer, BaseHTTPRequestHandler; import json;
        class H(BaseHTTPRequestHandler):
          def do_POST(self):
            self.send_response(200);
            self.send_header('Content-Type', 'application/json');
            self.end_headers();
            self.wfile.write(json.dumps({'api_key': 'container-key', 'key_id': 'container', 'enabled': True}).encode());
        HTTPServer(('0.0.0.0', 9999), H).serve_forever()
    ports:
      - "9999:9999"
    networks:
      - raider-net
    restart: unless-stopped

networks:
  raider-net:
    driver: bridge
