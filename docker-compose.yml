version: "3.8"

services:
  magostudio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: magostudio-app
    ports:
      - "7008:3000"
    volumes:
      - ./work:/app/work
      - ./video-output:/app/video-output
      - ./source:/app/source
      - ./data:/app/data
      - ./stub-localDesktop.ts:/app/src/platform/localDesktop.ts:ro
    environment:
      - PYTHONUNBUFFERED=1
      - MAGO_BACKEND_URL=http://localhost:9999
    networks:
      - raider-net
    restart: unless-stopped

  comfiui:
    build:
      context: ./comfyui-portable
      dockerfile: Dockerfile
    container_name: magostudio-comfiui
    ports:
      - "8188:8188"
    volumes:
      - ./work:/comfyui/work
      - ./video-output:/comfyui/video-output
      - ./comfyui-output:/comfyui/output
      - ./comfyui-models:/comfyui/models
      - ./source:/comfyui/source
    environment:
      - COMFYUI_PORT=8188
    networks:
      - raider-net
    restart: unless-stopped

  mock-auth:
    image: python:3.11-slim
    volumes:
      - ./mock-auth.py:/app/mock-auth.py:ro
    command: python3 /app/mock-auth.py
    ports:
      - "9999:9999"
    networks:
      - raider-net
    restart: unless-stopped

networks:
  raider-net:
    driver: bridge
